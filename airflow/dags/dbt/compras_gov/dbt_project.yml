# Pacote dbt do sistema estruturante Compras.gov.br (SIASG).
# Modelos compartilhados entre órgãos — ver ADR-0004 e ADR-0009.
#
# Bronze não é modelada aqui: é materializada pelas DAGs de ingestão e
# declarada como source em models/bronze/sources.yml (ADR-0017).

name: "compras_gov"
version: "0.1.0"
config-version: 2

profile: "gov_bricks"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  compras_gov:
    silver:
      +materialized: table
