# Pacote dbt do sistema estruturante Compras.gov.br (SIASG).
# Modelos compartilhados entre órgãos — ver ADR-0004 e ADR-0009.
#
# As fontes relacionais são declaradas em models/bronze/sources.yml (ADR-0017).
# A ARP também tem um modelo Bronze que materializa os Parquets no PostgreSQL.

name: "compras_gov"
version: "0.1.0"
config-version: 2

profile: "gov_bricks"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  compras_gov:
    silver:
      # Exceção local aos ADRs 0009/0010, registrada no ADR-0022.
      # Domínios continuam nas pastas; todas as Silvers deste sistema compartilham o schema.
      +schema: 002_slv_compras_gov
      +database: "{{ 'data_warehouse' if target.type == 'duckdb' else target.database }}"
      +materialized: table
