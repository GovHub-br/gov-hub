# GERADO por `make modelo` a partir de catalogo/sistemas/compras_gov.yml — não edite à mão.
#
# A Bronze não é materializada por dbt: ela é um source sobre a zona raw,
# onde a ingestão entrega o dado (ADR-0006, ADR-0017, ADR-0021).
#
# Esta é a forma de tabela, do backend `warehouse`. Em um deployment com a
# raw em object storage, o source aponta para os arquivos da entidade.

version: 2

sources:
  - name: compras_gov
    schema: compras_gov
    description: >
      Camada Bronze de Compras.gov.br (SIASG): dado fiel à fonte, gravado pelas
      DAGs de ingestão. Sistema estruturante de compras e contratações do governo
      federal. Expõe API pública de consulta a órgãos, UASGs, fornecedores,
      contratos, contratações e catálogos de material e serviço.
    meta:
      owner: "@GovHub-br/oss"
      sistema_origem: compras_gov
      camada: bronze
    tables:
      - name: arp
        identifier: raw_arp
        description: >
            Atas de Registro de Preço consultadas no módulo ARP do Compras.gov.br.
            Granularidade: uma linha por ata de registro de preço e compra.
        meta:
          classificacao: publico
          dag_ingestao: arp_ingest_dag

      - name: arp_adesoes_item
        identifier: raw_arp_adesoes_item
        description: >
            Adesões vinculadas aos itens das Atas de Registro de Preço. Granularidade:
            uma linha por adesão vinculada a um item de ata.
        meta:
          classificacao: publico
          dag_ingestao: arp_detalhes_ingest_dag

      - name: arp_empenhos_saldo
        identifier: raw_arp_empenhos_saldo
        description: >
            Empenhos e saldos vinculados às Atas de Registro de Preço. Granularidade:
            uma linha por empenho e saldo de uma ata.
        meta:
          classificacao: publico
          dag_ingestao: arp_detalhes_ingest_dag

      - name: arp_item
        identifier: raw_arp_item
        description: >
            Itens associados às Atas de Registro de Preço do Compras.gov.br.
            Granularidade: uma linha por item, fornecedor, ata, unidade gerenciadora e
            compra.
        meta:
          classificacao: publico
          dag_ingestao: arp_item_ingest_dag

      - name: arp_unidades_item
        identifier: raw_arp_unidades_item
        description: >
            Unidades vinculadas aos itens das Atas de Registro de Preço. Granularidade:
            uma linha por unidade vinculada a um item de ata.
        meta:
          classificacao: publico
          dag_ingestao: arp_detalhes_ingest_dag

      - name: contratacoes
        identifier: raw_contratacoes
        description: >
            Contratações publicadas sob a Lei 14.133, via integração com o PNCP.
            Granularidade: uma linha por compra.
        meta:
          classificacao: publico
          dag_ingestao: contratacoes_ingest_dag

      - name: contratos
        identifier: raw_contratos
        description: >
            Contratos administrativos por órgão. Uma linha por contrato de uma unidade
            gestora com um fornecedor. Granularidade: uma linha por unidade gestora,
            número de contrato e fornecedor.
        meta:
          classificacao: publico
          dag_ingestao: contratos_ingest_dag

      - name: contratos_item
        identifier: raw_contratos_item
        description: >
            Itens dos contratos administrativos. Granularidade: uma linha por item de um
            contrato.
        meta:
          classificacao: publico
          dag_ingestao: contratos_item_ingest_dag

      - name: fornecedor
        identifier: raw_fornecedor
        description: >
            Fornecedores ativos no Compras.gov.br. O cadastro já identifica cada
            fornecedor pelo documento, em duas colunas distintas — CNPJ para pessoa
            jurídica, CPF para pessoa física. Não existe aqui uma coluna única de número
            de inscrição (nu_ni): esta entidade expõe as chaves finais diretamente, sem
            precisar das pontes de nu_ni. Granularidade: um registro por fornecedor
            ativo, identificado por CNPJ ou CPF.
        meta:
          classificacao: pessoal
          dag_ingestao: fornecedor_ingest_dag

      - name: itens_contratacoes
        identifier: raw_itens_contratacoes
        description: >
            Itens das contratações publicadas sob a Lei 14.133. Granularidade: uma linha
            por item de compra.
        meta:
          classificacao: publico
          dag_ingestao: itens_contratacoes_ingest_dag

      - name: natureza_despesa_material
        identifier: raw_natureza_despesa_material
        description: >
            Associação entre os PDMs (padrões descritivos de material) do catálogo e as
            naturezas de despesa sob as quais o material é empenhado. Não é um cadastro
            de naturezas de despesa: a mesma natureza aparece em vários PDMs, e a origem
            repete pares sem deduplicar. Granularidade: uma linha por associação entre
            PDM e natureza de despesa.
        meta:
          classificacao: publico
          dag_ingestao: catalogo_material_natureza_despesa_ingest_dag

      - name: orgao
        identifier: raw_orgao
        description: >
            Órgãos cadastrados no Compras.gov.br. Uma linha por órgão. Granularidade: um
            registro por código de órgão.
        meta:
          classificacao: publico
          dag_ingestao: orgao_ingest_dag

      - name: pgc_agregacao
        identifier: raw_pgc_agregacao
        description: >
            Dados agregados do Plano de Contratações Anual por órgão e ano, incluindo
            quantidade total de itens e valor total estimado. Granularidade: uma linha
            por órgão e ano do Plano de Contratações Anual.
        meta:
          classificacao: publico
          dag_ingestao: pgc_agregacao_ingest_dag

      - name: pgc_detalhe
        identifier: raw_pgc_detalhe
        description: >
            Itens planejados no Plano de Contratações Anual, com informações do
            artefato, DFD, item de catálogo, quantidade e valor estimado. Granularidade:
            uma linha por item planejado de um Plano de Contratações Anual.
        meta:
          classificacao: publico
          dag_ingestao: pgc_detalhe_ingest_dag

      - name: pgc_detalhe_catalogo
        identifier: raw_pgc_detalhe_catalogo
        description: >
            Itens planejados no Plano de Contratações Anual consultados a partir de
            códigos de material e serviço do catálogo Compras.gov.br. Granularidade: uma
            linha por item planejado de um Plano de Contratações Anual, consultado por
            código de catálogo.
        meta:
          classificacao: publico
          dag_ingestao: pgc_detalhe_catalogo_ingest_dag

      - name: uasg
        identifier: raw_uasg
        description: >
            Unidades administrativas de serviços gerais. Uma linha por UASG.
            Granularidade: um registro por código de UASG.
        meta:
          classificacao: publico
          dag_ingestao: uasg_ingest_dag
