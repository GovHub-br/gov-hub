        meta:
          classificacao: publico
        data_tests:
          - not_null
      - name: nu_ni
        description: >
            Número de inscrição do fornecedor. Identificador do fornecedor no
            Compras.gov.br. Não é um tipo único: pode ser CNPJ (14 dígitos), CPF (11
            dígitos) ou UASG (6 dígitos, quando o fornecedor é um órgão público). Cruzar
            por nu_ni sem antes decidir o tipo é a origem mais comum de junção incorreta
            entre compras e cadastros externos — use as pontes declaradas abaixo.
            Normalizada a partir da coluna de origem 'nifornecedor'.
        meta:
          classificacao: publico
        data_tests:
          - not_null
      - name: codigounidadegestora
        description: >
            PREENCHER: o que a coluna 'codigounidadegestora' significa, na origem
            compras_gov.raw_contratos_item.
        meta:
          classificacao: publico
      - name: numerocontrato
        description: >
            PREENCHER: o que a coluna 'numerocontrato' significa, na origem
            compras_gov.raw_contratos_item.
        meta:
          classificacao: publico
      - name: nifornecedor
        description: >
            PREENCHER: o que a coluna 'nifornecedor' significa, na origem
            compras_gov.raw_contratos_item.
        meta:
          classificacao: publico
      - name: numeroitem
        description: >
            PREENCHER: o que a coluna 'numeroitem' significa, na origem
