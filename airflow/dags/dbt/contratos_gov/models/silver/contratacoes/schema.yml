      sistema_origem: contratos_gov
      camada: silver
      classificacao: publico
    columns:
      - name: id
        description: >
            PREENCHER: o que a coluna 'id' significa, na origem
            contratos_gov.raw_contratos.
        meta:
          classificacao: publico
      - name: dt_ingest
