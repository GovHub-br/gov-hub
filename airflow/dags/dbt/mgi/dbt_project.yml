# Projeto dbt do órgão MGI — ver ADR-0004 e ADR-0009.
#
# Reúne os pacotes dos sistemas estruturantes que o órgão consome e materializa
# a camada Gold, onde o cruzamento entre sistemas acontece.

name: "mgi"
version: "0.1.0"
config-version: 2

profile: "gov_bricks"

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  mgi:
    gold:
      +materialized: table
