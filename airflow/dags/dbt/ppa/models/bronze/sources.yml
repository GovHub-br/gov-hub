# GERADO por `make modelo` a partir de catalogo/sistemas/ppa.yml — não edite à mão.
#
# A Bronze não é materializada por dbt: ela é um source sobre a zona raw,
# onde a ingestão entrega o dado (ADR-0006, ADR-0017, ADR-0021).
#
# Esta é a forma de tabela, do backend `warehouse`. Em um deployment com a
# raw em object storage, o source aponta para os arquivos da entidade.

version: 2

sources:
  - name: ppa
    schema: ppa
    description: >
      Camada Bronze de PPA (Plano Plurianual 2024-2027): dado fiel à fonte,
      gravado pelas DAGs de ingestão. Dados abertos do Plano Plurianual 2024-2027
      (PPA/SIOP): programas, objetivos, entregas, metas, indicadores,
      desagregações, regionalizações, medidas institucionais e agendas
      transversais, publicados anualmente em zip/CSV (revisões 2024, 2025 e 2026).
    meta:
      owner: "@GovHub-br/oss"
      sistema_origem: ppa
      camada: bronze
    tables:
      - name: acao_nao_orcamentaria
        identifier: raw_acao_nao_orcamentaria
        description: >
            Camada bronze do PPA/SIOP — acao_nao_orcamentaria unificada (2024-2026) por
            ano_ppa, com conversão de tipos e auditoria (dt_ingest). Granularidade: uma
            linha por registro de acao nao orcamentaria, por ano_ppa (revisão do PPA —
            2024, 2025 ou 2026).
        meta:
          classificacao: publico
          dag_ingestao: ppa_ingest_dag

      - name: agenda
        identifier: raw_agenda
        description: >
            Camada bronze do PPA/SIOP — agenda unificada (2024-2026) por ano_ppa, com
            conversão de tipos e auditoria (dt_ingest). Granularidade: uma linha por
            registro de agenda, por ano_ppa (revisão do PPA — 2024, 2025 ou 2026).
        meta:
          classificacao: publico
          dag_ingestao: ppa_ingest_dag

      - name: agenda_desagregacao_meta_entrega
