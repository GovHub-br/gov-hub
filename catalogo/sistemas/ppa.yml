# PPA (Plano Plurianual) — dados abertos do PPA/SIOP 2024-2027.
# Ver catalogo/README.md e ADR-0017.
#
# Migrado de data-application-mir. Fonte 100% nacional/genérica: os dados
# abertos do PPA não têm nenhum filtro específico de órgão (ao contrário de
# tesouro_gerencial/mir, que extrai por e-mail de uma caixa do MIR). Por isso
# a ingestão vive direto em data_ingest/ppa/, sem subpasta de órgão (ADR-0004).
#
# Uma única DAG (ppa_ingest_dag) baixa os 3 zips anuais (revisões 2024, 2025,
# 2026) e ingere as 31 entidades de dentro de cada um — ver ADR-0007 (exceção
# deliberada: um zip por ano contém todas as 31 tabelas; separar em 31 DAGs
# forçaria 31 downloads redundantes do mesmo zip por execução).
#
# 3 tabelas presentes na fonte a partir de 2025 ficam FORA do catálogo, mesma
# exclusão deliberada da ingestão original: Indicador_Entrega_-_Meta_ODS,
# Indicador_Obj_Espec_-_Meta_ODS e Planos_Regionais_Desenvolvimento_-_Entrega.

sistema: ppa
nome: PPA (Plano Plurianual 2024-2027)
descricao: >-
  Dados abertos do Plano Plurianual 2024-2027 (PPA/SIOP): programas,
  objetivos, entregas, metas, indicadores, desagregações, regionalizações,
  medidas institucionais e agendas transversais, publicados anualmente em
  zip/CSV (revisões 2024, 2025 e 2026).
orgao_gestor: mpo
owner: "@GovHub-br/oss"
status: ingerido

