[project]
name = "gov-bricks"
version = "0.1.0"
description = "GovHub data-framework — base compartilhada de ingestão, transformação e qualidade de dados públicos"
authors = [{ name = "GovHub BR" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apache-airflow>=3.2,<3.3",
    "apache-airflow-providers-standard",
    "apache-airflow-providers-postgres>=7.0",
    "apache-airflow-providers-microsoft-mssql==3.7.2",
    "numpy==1.26.4",
    "dbt-core==1.12.0",
    "dbt-postgres",
    "pandas",
    "requests",
    "httpx",
    "sqlalchemy",
    "imap-tools",
    "chardet",
    "pytz",
    "astronomer-cosmos>=1.14",
    "polars",
    "pyarrow",
    "s3fs",
    "boto3",
    "adlfs",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "ruff",
    "pytest",
    "pytest-cov",
    "ty",
    "jupyter",
    "moto[s3]",
    "shandy-sqlfmt",
]

[tool.uv]
package = false

[tool.black]
line-length = 90
target-version = ["py311"]
skip-string-normalization = false
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.conda
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "migrations",
    "build",
    "dist",
    "*.pyi",
    ".ipynb_checkpoints",
    "*.ipynb"
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["C901"]

[tool.ty.environment]
root = ["airflow/plugins", "airflow/helpers", "airflow/dags", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["airflow/helpers", "airflow/plugins", "airflow/dags"]
markers = [
    "integration: requires a live MinIO instance (docker-compose up)",
    "unit: pure unit tests with no external dependencies",
]

[tool.coverage.run]
source = ["airflow/plugins", "airflow/helpers"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.sqlfmt]
line_length = 120
dialect = "polyglot"
exclude = [
    "**/.git/**",
    "**/.venv/**",
    "**/build/**",
    "**/dist/**",
    "**/target/**",
    "**/compiled/**",
    "**/dbt_packages/**"
]

